[project]
name = "Arabic-Sign-Language-Prediction"
version = "0.1.0"
description = "A modular framework for training an ArSL model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Al-ameen007" },
]

# ── Core dependencies ──────────────────────────────────────────────
dependencies = [
    "torch>=2.0.0",
    "scikit-learn"
]

# ── Optional dependency groups ─────────────────────────────────────
[project.optional-dependencies]
# For Preprocessing and Filtering
preprocess = [
    "torch-geometric",
    "pandas",
    "opencv-python",
    "networkx",
    "scipy",
    "numpy==1.24.0",
    "mediapipe==0.10.8",
    "tqdm"
]
# For Visualizing on inference
viz = [
    "matplotlib>=3.5.0",
]
# Everything (for development convenience)
all = [
    "Arabic-Sign-Language-Prediction[preprocess,viz]",
]
# Dev/test tools
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "nox>=2023.4",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

# ── CLI entry points ──────────────────────────────────────────────
[project.scripts]
arsl-train          = "arsl.train:main"
arsl-infer          = "arsl.inference:main"

# ── Build system ──────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arsl"]

# ── Ruff (replaces flake8, isort, pyflakes, pycodestyle) ──────────
[tool.ruff]
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["arsl"]

# ── Pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
